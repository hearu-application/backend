version: "3.8"

services:
  app:
    container_name: hearu-dev
    image: ${DOCKER_IMAGE}:${DOCKER_TAG}
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
    # 기본값 10s는 AI 큐 종료 대기 상한(AsyncConfig 50s)보다 짧아 SIGKILL이 먼저 온다.
    stop_grace_period: 60s
    restart: on-failure:3