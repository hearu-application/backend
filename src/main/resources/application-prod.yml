spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: info
    com.example.hearu: info
    com.example.hearu.common.security: warn
    org.hibernate.sql: off
    org.hibernate.type.descriptor.sql: off

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false