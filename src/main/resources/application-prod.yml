spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    # 프레임워크/서드파티는 WARN 이상만. 애플리케이션 비즈니스 이벤트는 INFO까지 남겨
    # 장애 시 정상 흐름을 추적할 수 있게 한다.
    root: warn
    com.example.hearu: info

    # 인증 실패 로그는 봇 트래픽으로 다량 발생하므로 WARN 이상만 남긴다.
    com.example.hearu.common.security: warn

    # 진단용. OAuth 인증 경로의 단계별 소요 시간을 로그 타임스탬프 간격으로 재기 위한 것으로,
    # 원인이 확정되면 제거한다. 이 경로의 DEBUG 로그는 LogMasker를 거치므로 원문이 남지 않는다.
    com.example.hearu.auth: debug

    # root가 WARN이라 이미 억제되지만, 실수로 root를 낮추더라도
    # 운영 DB 쿼리와 바인딩 파라미터가 노출되지 않도록 명시적으로 차단한다.
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
