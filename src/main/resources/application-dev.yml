spring:
  jpa:
    # show-sql은 System.out으로 직접 출력해 logback(MDC/레벨)을 우회하므로 끈다.
    # SQL 로그는 아래 logging.level.org.hibernate.SQL로 제어한다.
    show-sql: false
    hibernate:
      # 스키마 변경은 Flyway가 전담한다. Hibernate는 엔티티와 스키마 일치 여부만 검증한다.
      ddl-auto: validate

logging:
  level:
    # 프레임워크는 INFO, 우리 애플리케이션은 DEBUG까지 전부 노출
    root: info
    com.example.hearu: debug

    # SQL 및 바인딩 파라미터 (Hibernate 6 경로)
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

jwt:
  issuer: hearu-dev
