server:
  tomcat:
    connection-timeout: 5000

spring:
  application:
    name: hearu

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        connectTimeout: 5000
        socketTimeout: 10000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

  # Flyway가 스키마의 단일 소스다. ddl-auto는 프로필별로 validate로 두어 검증만 담당한다.
  flyway:
    enabled: true
    # 기존 dev/prod DB는 이미 스키마가 있다(Flyway 도입 이전). 스키마가 비어있지 않은데
    # 이력 테이블이 없으면, V1을 실행하지 않고 baseline-version(1)으로 표시만 한 뒤 V2부터 적용한다.
    # 빈 DB(신규 개발자 로컬)에서는 V1부터 순서대로 전부 적용한다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Flyway 도입 이전 스키마 (baseline)"

oauth:
  kakao:
    client-id: ${KAKAO_REST_API_KEY}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  apple:
    client-ids: ${APPLE_CLIENT_IDS}

jwt:
  access-token:
    expire-time: ${ACCESS_TOKEN_EXPIRE_TIME}
  refresh-token:
    expire-time: ${REFRESH_TOKEN_EXPIRE_TIME}
  secret-key: ${JWT_SECRET_KEY}

llm:
  completion-url: ${LLM_COMPLETION_URL}
  api-key: ${LLM_API_KEY}
  temperature: 0.5
  top-k: 0
  top-p: 0.8
  repeat-penalty: 1.1
  max-tokens: 1000

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}

scheduler:
  refresh-token:
    cleanup:
      cron: "0 0 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health