server:
  tomcat:
    connection-timeout: 5000

spring:
  application:
    name: hearu

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        connectTimeout: 5000
        socketTimeout: 10000

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

  # Flyway가 스키마의 단일 소스다. ddl-auto는 프로필별로 validate로 두어 검증만 담당한다.
  flyway:
    enabled: true
    # 기존 dev/prod DB는 이미 스키마가 있다(Flyway 도입 이전). 스키마가 비어있지 않은데
    # 이력 테이블이 없으면, V1을 실행하지 않고 baseline-version(1)으로 표시만 한 뒤 V2부터 적용한다.
    # 빈 DB(신규 개발자 로컬)에서는 V1부터 순서대로 전부 적용한다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Flyway 도입 이전 스키마 (baseline)"

oauth:
  kakao:
    client-id: ${KAKAO_REST_API_KEY}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  apple:
    client-ids: ${APPLE_CLIENT_IDS}

jwt:
  access-token:
    expire-time: ${ACCESS_TOKEN_EXPIRE_TIME}
  refresh-token:
    expire-time: ${REFRESH_TOKEN_EXPIRE_TIME}
  secret-key: ${JWT_SECRET_KEY}
  # 토큰 발급 환경 식별자. 발급 시 iss에 넣고 검증 시 일치를 요구한다.
  # 프로필 yml이 덮어쓴다(hearu-local/dev/prod). 프로필 없이 떠도 prod 값과는 달라서 안전하다.
  issuer: hearu-default

llm:
  completion-url: ${LLM_COMPLETION_URL}
  api-key: ${LLM_API_KEY}
  # OpenAI GPT-5.6 Luna. temperature/top_p/top_k는 reasoning 모델에서 400 나므로 안 보낸다.
  model: ${LLM_MODEL:gpt-5.6-luna}
  reasoning-effort: ${LLM_REASONING_EFFORT:medium}
  max-completion-tokens: ${LLM_MAX_COMPLETION_TOKENS:1500}

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}

# 일기·AI 응답 본문 컬럼 암호화 키
diary:
  encryption:
    active-version: ${DIARY_ENCRYPTION_KEY_VERSION:1}
    keys:
      1: ${DIARY_ENCRYPTION_KEY:}

scheduler:
  refresh-token:
    cleanup:
      cron: "0 0 3 * * *"
  # 유예가 끝난 탈퇴 유저 하드 삭제 (docs/withdrawal-grace-period.md)
  withdrawal:
    purge:
      cron: "0 0 * * * *"

# 회원 탈퇴 유예 기간. 이 기간 안에는 복구할 수 있고, 지나면 하드 삭제 대상이 된다.
user:
  withdrawal:
    grace-period: 24h

# 서빙 중인 TLS 인증서 만료 감시 (자동 갱신 실패의 직접 신호 — docs/plan/cert-expiry-monitoring.md)
cert:
  check:
    cron: "0 0 9 * * *"
  sni-host: hearu.p-e.kr
  target-host: nginx
  target-port: 443
  warn-threshold-days: 21
  timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health