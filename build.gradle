plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'hearu'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ==================== Core Spring Boot ====================
	// JPA/Hibernate ORM 지원 - 데이터베이스 연동
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Spring MVC 웹 애플리케이션 지원
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Bean Validation (JSR-380) 지원 - @NotBlank, @Size 등
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// ==================== Lombok ====================
	// 보일러플레이트 코드 제거 - @Getter, @RequiredArgsConstructor 등
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ==================== Security ====================
	// Spring Security 핵심 기능
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// OAuth2 Resource Server - JWT 토큰 검증 지원
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	// ==================== JWT ====================
	// JWT 생성 및 파싱 라이브러리
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// ==================== Database ====================
	// MySQL JDBC 드라이버
	runtimeOnly 'com.mysql:mysql-connector-j'

	// ==================== Resilience ====================
	// 재시도 로직 지원 - @Retryable (AI API 호출 등에 활용)
	implementation 'org.springframework.retry:spring-retry'
	// AOP 지원 - @Async, @Retryable 등 어노테이션 프록시 처리
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// ==================== Monitoring ====================
	// Actuator - 헬스체크 제공
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ==================== API 명세 =======================
    // Swagger - API 명세 자동 제공
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

	// ==================== Test ====================
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}