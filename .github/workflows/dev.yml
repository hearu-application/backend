name: Dev Deploy

on:
  push:
    branches: [dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===================================
  # 1. Build & Test
  # ===================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          retention-days: 1

  # ===================================
  # 2. Docker Build & Push to GHCR
  # ===================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAR_FILE=build/libs/*.jar

  # ===================================
  # 3. Deploy to Dev Server
  # ===================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          source: "docker-compose.dev.yml"
          target: "~/hearu"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          script: |
            cd ~/hearu
            
            # GHCR 로그인
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u hearu-application --password-stdin
            
            # .env 생성
            cat > .env << EOF
            # Docker Image
            DOCKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            DOCKER_TAG=dev
            
            # Database
            DB_URL=${{ secrets.DEV_DB_URL }}
            DB_USERNAME=${{ secrets.DEV_DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            
            # JWT
            JWT_SECRET_KEY=${{ secrets.DEV_JWT_SECRET_KEY }}
            ACCESS_TOKEN_EXPIRE_TIME=${{ secrets.DEV_ACCESS_TOKEN_EXPIRE_TIME }}
            REFRESH_TOKEN_EXPIRE_TIME=${{ secrets.DEV_REFRESH_TOKEN_EXPIRE_TIME }}
            
            # OAuth
            GOOGLE_CLIENT_ID=${{ secrets.DEV_GOOGLE_CLIENT_ID }}
            KAKAO_REST_API_KEY=${{ secrets.DEV_KAKAO_CLIENT_ID }}
            
            # Naver Clova
            LLM_API_KEY=${{ secrets.DEV_CLOVA_API_KEY }}
            LLM_COMPLETION_URL=${{ secrets.DEV_CLOVA_COMPLETION_URL }}
            
            # Slack
            SLACK_WEBHOOK_URL=${{ secrets.DEV_SLACK_WEBHOOK_URL }}
            EOF
            
            # 배포
            docker compose -f docker-compose.dev.yml pull app
            docker compose -f docker-compose.dev.yml up -d --remove-orphans
            
            # 정리
            docker image prune -f
            
            # 헬스체크
            sleep 60
            curl -f http://localhost:8080/actuator/health || exit 1