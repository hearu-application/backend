name: Prod Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===================================
  # 1. Build & Test
  # ===================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          retention-days: 1

  # ===================================
  # 2. Docker Build & Push to GHCR
  # ===================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod
            type=sha,prefix=prod-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAR_FILE=build/libs/*.jar

  # ===================================
  # 3. Deploy to Prod Server
  # ===================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          source: "docker-compose.prod.yml,nginx/,init-letsencrypt.sh"
          target: "~/hearu"

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: ${{ secrets.PROD_SERVER_PORT }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/hearu

            # GHCR 로그인 (워크플로 실행 중에만 유효한 GITHUB_TOKEN 사용 — PAT 불필요, 만료 관리 대상 아님)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # .env 생성
            cat > .env << EOF
            # Docker Image
            DOCKER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            DOCKER_TAG=prod-${{ github.sha }}

            # Database
            DB_URL=${{ secrets.PROD_DB_URL }}
            DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}

            # JWT
            JWT_SECRET_KEY=${{ secrets.PROD_JWT_SECRET_KEY }}
            ACCESS_TOKEN_EXPIRE_TIME=${{ secrets.PROD_ACCESS_TOKEN_EXPIRE_TIME }}
            REFRESH_TOKEN_EXPIRE_TIME=${{ secrets.PROD_REFRESH_TOKEN_EXPIRE_TIME }}

            # OAuth
            GOOGLE_CLIENT_ID=${{ secrets.PROD_GOOGLE_CLIENT_ID }}
            KAKAO_REST_API_KEY=${{ secrets.PROD_KAKAO_CLIENT_ID }}
            APPLE_CLIENT_IDS=${{ secrets.PROD_APPLE_CLIENT_IDS }}

            # Naver Clova
            LLM_API_KEY=${{ secrets.PROD_CLOVA_API_KEY }}
            LLM_COMPLETION_URL=${{ secrets.PROD_CLOVA_COMPLETION_URL }}

            # Discord
            DISCORD_WEBHOOK_URL=${{ secrets.PROD_DISCORD_WEBHOOK_URL }}
            EOF

            chmod 600 .env

            # 최초 배포 시 SSL 인증서 발급
            if [ ! -d "./certbot/conf/live/hearu.p-e.kr" ]; then
              chmod +x init-letsencrypt.sh
              ./init-letsencrypt.sh
            fi

            # 배포
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 배포 검증 — 실행 중인 이미지가 실제로 이번 커밋인지 확인
            DEPLOYED_SHA=$(docker inspect hearu-prod --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            if [ "$DEPLOYED_SHA" != "${{ github.sha }}" ]; then
              echo "배포 검증 실패: 실행 중인 이미지 SHA($DEPLOYED_SHA) != 이번 커밋(${{ github.sha }})" >&2
              exit 1
            fi

            docker compose -f docker-compose.prod.yml exec nginx nginx -s reload || true

            # 정리
            docker image prune -f

            # 헬스체크
            for i in $(seq 1 12); do
              if curl -sf https://hearu.p-e.kr/actuator/health; then
                break
              fi
              if [ "$i" -eq 12 ]; then
                exit 1
              fi
              sleep 10
            done